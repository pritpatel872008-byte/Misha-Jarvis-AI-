name: Backend API tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile vercel-backend/api/ai/chat.py
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test production AI endpoint
        env:
          MISHA_API_URL: https://misha-voice-ai-api.vercel.app/api/ai/chat
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          payload = json.dumps({
              "messages": [{"role": "user", "content": "Reply with exactly: MISHA_SMOKE_OK"}]
          }).encode()
          request = urllib.request.Request(
              os.environ["MISHA_API_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=35) as response:
                  status = response.status
                  body = response.read(4096).decode("utf-8", "replace")
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read(4096).decode("utf-8", "replace")
          print(f"Production AI endpoint HTTP status: {status}")
          try:
              result = json.loads(body)
          except json.JSONDecodeError:
              raise SystemExit("Production AI endpoint returned non-JSON output.")
          if status != 200 or not isinstance(result.get("reply"), str) or not result["reply"].strip():
              diagnostic = {
                  key: result.get(key)
                  for key in ("error", "provider_status", "detail")
                  if key in result
              }
              detail = str(diagnostic.get("detail", ""))[:1000]
              # Defensive redaction: never print a possible API key from provider errors.
              detail = re.sub(r"(?i)(key=)[^&\\s]+", r"\\1[REDACTED]", detail)
              diagnostic["detail"] = detail
              print(json.dumps(diagnostic))
              raise SystemExit("Production AI smoke test failed.")
          print("Production AI smoke test passed with a non-empty reply.")
          PY
